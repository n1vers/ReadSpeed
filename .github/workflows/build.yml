name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ReadPerfomance.csproj --runtime win-x64

      - name: Build
        run: dotnet build ReadPerfomance.csproj --configuration Release --runtime win-x64 --no-restore

      - name: Publish self-contained EXE
        run: >-
          dotnet publish ReadPerfomance.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          --output publish

      - name: Upload EXE artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: ReadSpeed-win-x64
          path: publish\ReadSpeed.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish framework-dependent EXE
        run: >-
          dotnet publish ReadPerfomance.csproj
          --configuration Release
          --runtime win-x64
          --self-contained false
          --no-restore
          -p:PublishSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          --output publish-framework-dependent

      - name: Upload framework-dependent EXE artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: ReadSpeed-win-x64-framework-dependent
          path: publish-framework-dependent\ReadSpeed.exe
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: publish\ReadSpeed.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
